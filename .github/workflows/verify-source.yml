# Prove that a requested source revision belongs to the trusted release lineage.
#
# ES-08 D10 moved the delivery entry points onto the repository's default
# branch so GitHub would register them. That separates three things which were
# previously the same thing (ADR-0008 section 5a):
#
#   where the workflow definition lives   the default branch
#   which source revision is built        this workflow's answer
#   what is deployed                      an immutable digest
#
# Once an entry point takes a ref as an input, the input is attacker-reachable:
# anyone who can dispatch a workflow can type a ref. Without this gate, typing
# your own branch into `source_ref` would build your own branch under the
# artifact-publication identity. That is the whole of the threat, and this is
# the whole of the control:
#
#   a revision is trusted if, and only if, it is already reachable from the
#   managed-cloud release branch
#
# Reachability, not string equality. `gcp` is checked by name, but the answer is
# `git merge-base --is-ancestor`, so a tag or an explicit commit that has
# already landed on the release branch is accepted, and a branch that merely
# *contains* the release branch is not. Nothing an untrusted contributor can
# push is reachable from `gcp` until a maintainer merges it there, which is the
# review boundary this leans on.
#
# The resolved SHA is the output, and callers check *that* out rather than the
# string that was typed. A ref resolved once and then re-resolved in a
# credentialed job is a time-of-check/time-of-use gap: a branch can move between
# the two reads.
#
# This workflow holds no credential and declares no environment. It must stay
# that way: it is the thing that runs *before* a credential exists.

name: Verify source trust

on:
  workflow_call:
    inputs:
      source_ref:
        description: "Branch, tag or commit to build or deploy from"
        required: true
        type: string
      trusted_branch:
        description: "Release lineage the revision must be reachable from"
        required: false
        type: string
        default: "gcp"
    outputs:
      source_sha:
        description: "Full commit SHA, verified to be reachable from the trusted branch"
        value: ${{ jobs.verify.outputs.source_sha }}
      trusted_branch:
        description: "Branch the revision was verified against"
        value: ${{ jobs.verify.outputs.trusted_branch }}

permissions:
  contents: read

jobs:
  verify:
    name: Source trust
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # No id-token, and no environment. This job must not be able to obtain a
    # deployment credential even by accident: it is the gate, not a consumer.
    permissions:
      contents: read

    outputs:
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      trusted_branch: ${{ steps.resolve.outputs.trusted_branch }}

    steps:
      # Full history: ancestry cannot be decided from a shallow clone, and a
      # shallow clone fails *open* if the check is written carelessly.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and verify the requested revision
        id: resolve
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          TRUSTED_BRANCH: ${{ inputs.trusted_branch }}
        run: |
          set -euo pipefail

          # Refuse anything that is not a plausible ref or SHA before it reaches
          # git. Not the security boundary -- ancestry is -- but it keeps option
          # injection and shell metacharacters out of the argument entirely.
          case "$SOURCE_REF" in
            -*|*' '*|*'"'*|*"'"*|*'$'*|*'`'*|*';'*|*'&'*|*'|'*|*'('*|*')'*|*'<'*|*'>'*|*'*'*|*'?'*|*'['*|*'^'*|*'~'*|*':'*|*'\'*)
              echo "::error::Refusing source_ref '${SOURCE_REF}': not a plain ref or commit."
              exit 1
              ;;
          esac

          git fetch --no-tags --prune origin \
            "+refs/heads/${TRUSTED_BRANCH}:refs/remotes/origin/${TRUSTED_BRANCH}"

          trusted_sha="$(git rev-parse --verify "refs/remotes/origin/${TRUSTED_BRANCH}")"

          # Fetch the requested revision explicitly. A commit that is already
          # reachable from the trusted branch is present after the fetch above,
          # so this only has to succeed for refs; a failure here is not fatal,
          # because the ancestry check below is what decides.
          git fetch --no-tags origin "$SOURCE_REF" 2>/dev/null || true

          source_sha=""
          for candidate in \
            "refs/remotes/origin/${SOURCE_REF}" \
            "refs/tags/${SOURCE_REF}" \
            "FETCH_HEAD" \
            "${SOURCE_REF}"; do
            if source_sha="$(git rev-parse --verify --quiet "${candidate}^{commit}")"; then
              break
            fi
            source_sha=""
          done

          if [ -z "$source_sha" ]; then
            echo "::error::source_ref '${SOURCE_REF}' does not resolve to a commit in this repository."
            exit 1
          fi

          # The gate.
          if ! git merge-base --is-ancestor "$source_sha" "$trusted_sha"; then
            echo "::error::Refusing to build or deploy ${source_sha}."
            echo "::error::It is not reachable from '${TRUSTED_BRANCH}' (${trusted_sha})."
            echo "::error::Only revisions a maintainer has already merged to the release lineage may obtain a deployment identity."
            exit 1
          fi

          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "trusted_branch=${TRUSTED_BRANCH}" >> "$GITHUB_OUTPUT"

          {
            echo "### Source trust"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| requested | \`${SOURCE_REF}\` |"
            echo "| resolved | \`${source_sha}\` |"
            echo "| trusted branch | \`${TRUSTED_BRANCH}\` (\`${trusted_sha}\`) |"
            echo "| verdict | reachable from the release lineage |"
          } >> "$GITHUB_STEP_SUMMARY"
