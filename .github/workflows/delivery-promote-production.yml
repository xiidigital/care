# Delivery control plane: promote a staging-accepted digest to production.
#
# See delivery-build.yml for why this file is on the default branch.
#
# This shim does not weaken the production gate, and cannot. The gate is the
# `production` GitHub Environment and its required reviewer, declared by the
# implementation on the release lineage; the GCP trust binding for the
# production deployment identity accepts only that environment claim. A shim
# that called the implementation without it would obtain nothing.
#
# The eligibility rule is likewise the implementation's: promotion looks for the
# staging acceptance record naming this exact digest, and refuses a digest that
# has none.

name: Delivery — promote to production

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "sha256:... of a digest that passed staging acceptance"
        required: true
        type: string
      source_sha:
        description: "Commit that produced the digest"
        required: false
        type: string
      dry_run:
        description: "Show the intended promotion and change nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  production:
    name: Production
    # A called workflow cannot request more than its caller was granted, and
    # the implementation's credentialed job asks for `id-token: write`. Granting
    # it here is permission to *request* an OIDC token, not a credential: the
    # token is only exchanged for a GCP identity by the job that declares the
    # matching GitHub Environment, and the workload identity binding accepts
    # nothing else. Scoped to this job rather than the workflow so the grant is
    # visible where it is used.
    permissions:
      contents: read
      id-token: write
    uses: xiidigital/care/.github/workflows/promote-production.yml@gcp
    with:
      image_digest: ${{ inputs.image_digest }}
      source_sha: ${{ inputs.source_sha }}
      dry_run: ${{ inputs.dry_run }}
