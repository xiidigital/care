# Build the production image once, publish it, and identify it by digest.
#
# This is the artifact-production half of ADR-0008: source in, one immutable
# OCI image out, with enough metadata to say what it was built from. It knows
# nothing about staging, production, Cloud Run, a Cloud SQL instance or a
# domain. The registry it publishes to is configuration
# (ADR-0008 sections 6, 19, ES-08 section 19).
#
# TRUST
#
# Publication requires CI to pass first (ADR-0008 section 100), and the
# publishing job runs in the `artifact-publication` GitHub Environment, which is
# what the GCP workload-identity binding trusts. A pull request cannot reach it:
# a fork's token carries a different `repository` claim and is rejected at
# exchange, and a same-repository pull request declares no environment, so the
# impersonation binding does not match either.
#
# NO KEY
#
# Authentication is a GitHub OIDC token exchanged for a short-lived
# access token (ADR-0008 section 23). There is no service-account JSON anywhere
# in this repository or in its GitHub secrets.

name: Build and publish image

on:
  # The trusted release event (ES-08 section 104): a push to the fork's
  # integration branch produces a release candidate. It does not deploy
  # anything by itself.
  push:
    branches:
      - gcp
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: "Deploy the published digest to staging after publication"
        type: boolean
        default: false
  workflow_call:
    inputs:
      deploy_staging:
        type: boolean
        default: false
    outputs:
      image_digest:
        description: "Immutable digest of the published image"
        value: ${{ jobs.publish.outputs.image_digest }}
      image_ref:
        description: "repository@sha256:... reference"
        value: ${{ jobs.publish.outputs.image_ref }}
      source_sha:
        description: "Commit the image was built from"
        value: ${{ jobs.publish.outputs.source_sha }}

permissions:
  contents: read

# One publication per ref at a time. Not cancel-in-progress: a build that has
# already pushed layers should finish and record its digest rather than leave a
# half-published artifact nobody has a record of.
concurrency:
  group: care-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same validation a pull request gets, in full. Publication is gated on
  # it: a failed test run must not produce an artifact that promotion will later
  # treat as a candidate (ADR-0008 section 100).
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to Artifact Registry
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    # Gates the credential, not a human: this environment exists so the GCP
    # trust expression has something to match, and it holds the non-secret
    # registry configuration (ES-08 sections 18, 73).
    environment: artifact-publication

    permissions:
      contents: read
      id-token: write # the OIDC token; nothing else

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.reference.outputs.image_ref }}
      source_sha: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v5

      # Deployment identifiers are variables, not secrets. A project id and a
      # region authenticate nobody (ES-08 section 72).
      - name: Require registry configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_PUBLISHER_SERVICE_ACCOUNT: ${{ vars.GCP_PUBLISHER_SERVICE_ACCOUNT }}
        run: |
          missing=""
          for name in GCP_PROJECT_ID GCP_REGION ARTIFACT_REGISTRY_REPOSITORY \
                      GCP_WORKLOAD_IDENTITY_PROVIDER GCP_PUBLISHER_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository or environment variables:${missing}."
            echo "::error::See docs/xii/architecture/08-continuous-delivery.md for what each one is."
            exit 1
          fi

      # google-github-actions/auth v3.0.0, pinned to its commit. This action
      # mints credentials; a moved tag here would change what does that
      # (ES-08 sections 102, 168).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLISHER_SERVICE_ACCOUNT }}

      # google-github-actions/setup-gcloud v3.0.1
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Resolve the image repository
        id: reference
        run: |
          repository="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPOSITORY }}/${{ vars.IMAGE_NAME || 'care' }}"
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "Publishing to ${repository}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The repository's production Dockerfile, from a clean checkout, with the
      # commit as APP_VERSION. Two mutable tags for human convenience and one
      # digest for everything that matters (ADR-0008 section 4,
      # ES-08 section 25).
      #
      # Cache is a GitHub Actions cache, not a developer's machine: a build must
      # not depend on a private local cache to succeed (ES-08 section 24).
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/prod.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.reference.outputs.repository }}:${{ github.sha }}
            ${{ steps.reference.outputs.repository }}:candidate
          build-args: |
            APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The digest the registry recorded, read back rather than taken from the
      # build's own output alone. The registry is the authority on what exists.
      - name: Confirm the digest in the registry
        id: confirm
        run: |
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "::error::the build produced no digest"
            exit 1
          fi
          ref="${{ steps.reference.outputs.repository }}@${digest}"
          gcloud artifacts docker images describe "$ref" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --format='value(image_summary.digest)'
          echo "image_ref=${ref}" >> "$GITHUB_OUTPUT"

      - name: Verify the published image
        run: |
          docker pull "${{ steps.confirm.outputs.image_ref }}"
          infrastructure/scripts/verify-image.sh \
            --image "${{ steps.confirm.outputs.image_ref }}" \
            --inventory-out image-inventory.txt

      # Provenance: source commit -> CI run -> digest, plus the upstream base
      # this fork is built on (ADR-0008 sections 25, 26, ES-08 sections 27, 53,
      # 126). Non-secret by construction — every field is an identifier.
      - name: Write release metadata
        id: metadata
        run: |
          upstream_commit="$(sed -n 's/^commit=//p' UPSTREAM_BASE | head -1)"
          upstream_repository="$(sed -n 's/^repository=//p' UPSTREAM_BASE | head -1)"
          cat > release-metadata.json <<EOF
          {
            "schema": "care.release-metadata/1",
            "source_repository": "${{ github.server_url }}/${{ github.repository }}",
            "source_ref": "${{ github.ref }}",
            "source_commit": "${{ github.sha }}",
            "upstream_repository": "${upstream_repository}",
            "upstream_base_commit": "${upstream_commit}",
            "image_repository": "${{ steps.reference.outputs.repository }}",
            "image_digest": "${{ steps.build.outputs.digest }}",
            "image_ref": "${{ steps.confirm.outputs.image_ref }}",
            "image_tags": ["${{ github.sha }}", "candidate"],
            "workflow": "${{ github.workflow }}",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "built_by": "${{ github.actor }}",
            "platforms": ["linux/amd64"]
          }
          EOF
          python -c "import json;json.load(open('release-metadata.json'))"
          cat release-metadata.json
          echo "upstream_base=${upstream_commit}" >> "$GITHUB_OUTPUT"

      - name: Upload release metadata
        uses: actions/upload-artifact@v5
        with:
          name: release-metadata-${{ github.sha }}
          path: |
            release-metadata.json
            image-inventory.txt
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| reference | \`${{ steps.confirm.outputs.image_ref }}\` |"
            echo "| source commit | \`${{ github.sha }}\` |"
            echo "| upstream base | \`${{ steps.metadata.outputs.upstream_base }}\` |"
            echo "| run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
            echo ""
            echo "Deploy it with the \`Deploy to staging\` workflow and this digest."
            echo "Nothing has been deployed by this run."
          } >> "$GITHUB_STEP_SUMMARY"

  # Deployment is a separate workflow with separate credentials. It is called
  # here only when asked for, and it receives the digest this run produced —
  # never a branch name, and never HEAD, which may have moved since the build
  # (ES-08 section 155).
  deploy-staging:
    name: Staging
    needs: publish
    if: inputs.deploy_staging
    uses: ./.github/workflows/deploy-staging.yml
    with:
      image_digest: ${{ needs.publish.outputs.image_digest }}
      source_sha: ${{ needs.publish.outputs.source_sha }}
