# Delivery control plane: redeploy a previously published digest.
#
# See delivery-build.yml for why this file is on the default branch.
#
# Rollback is a deployment of an existing immutable artifact, not a revert of
# source and not a rebuild (ADR-0008 section 48). The digest to return to is
# reported by every deployment as its "previous digest", so the value typed here
# comes from a run record rather than from memory.

name: Delivery — roll back

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to roll back"
        required: true
        type: choice
        options:
          - staging
          - production
      image_digest:
        description: "sha256:... of the digest to roll back to"
        required: true
        type: string
      confirm_environment:
        description: "Type the environment name again to confirm"
        required: true
        type: string
      source_sha:
        description: "Commit that produced the digest, if known"
        required: false
        type: string

permissions:
  contents: read

jobs:
  rollback:
    name: Roll back ${{ inputs.environment }}
    # A called workflow cannot request more than its caller was granted, and
    # the implementation's credentialed job asks for `id-token: write`. Granting
    # it here is permission to *request* an OIDC token, not a credential: the
    # token is only exchanged for a GCP identity by the job that declares the
    # matching GitHub Environment, and the workload identity binding accepts
    # nothing else. Scoped to this job rather than the workflow so the grant is
    # visible where it is used.
    permissions:
      contents: read
      id-token: write
    uses: xiidigital/care/.github/workflows/rollback.yml@gcp
    with:
      environment: ${{ inputs.environment }}
      image_digest: ${{ inputs.image_digest }}
      confirm_environment: ${{ inputs.confirm_environment }}
      source_sha: ${{ inputs.source_sha }}
