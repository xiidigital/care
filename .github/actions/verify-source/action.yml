# Prove that a requested source revision belongs to the trusted release lineage.
#
# A composite action rather than a reusable workflow, and that is not a style
# choice. GitHub limits how deeply reusable workflows may call one another, and
# the delivery chain already spends levels on the control plane and on the
# deployment split:
#
#   delivery-deploy-staging (default branch)
#     -> deploy-staging
#       -> deploy-app
#
# A fourth level for the trust gate exceeded the limit and failed at startup,
# with no log and no annotation to say so. A composite action costs no nesting
# level at all, so the gate can run everywhere it is needed -- before the build,
# before a deployment, before an infrastructure apply -- without competing with
# the workflow structure for depth.
#
# What it decides (ADR-0008 section 5a):
#
#   a revision is trusted if, and only if, it is already reachable from the
#   managed-cloud release branch
#
# Reachability, not string equality. `gcp` is named, but the answer is
# `git merge-base --is-ancestor`, so a tag or explicit commit already merged to
# the release branch is accepted and a branch that merely *contains* it is not.
# Nothing an untrusted contributor can push is reachable from `gcp` until a
# maintainer merges it there, which is the review boundary this leans on.
#
# The caller must check out with `fetch-depth: 0`: ancestry cannot be decided
# from a shallow clone, and a shallow clone fails *open* if the check is written
# carelessly.
#
# The resolved SHA is the output, and callers check *that* out rather than the
# string that was typed. A ref resolved once and re-resolved in a credentialed
# job is a time-of-check/time-of-use gap: a branch can move between the reads.

name: Verify source trust
description: Refuse any revision that is not already reachable from the release lineage.

inputs:
  source_ref:
    description: "Branch, tag or commit to build or deploy from"
    required: true
  trusted_branch:
    description: "Release lineage the revision must be reachable from"
    required: false
    default: "gcp"

outputs:
  source_sha:
    description: "Full commit SHA, verified reachable from the trusted branch"
    value: ${{ steps.resolve.outputs.source_sha }}
  trusted_branch:
    description: "Branch the revision was verified against"
    value: ${{ steps.resolve.outputs.trusted_branch }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        SOURCE_REF: ${{ inputs.source_ref }}
        TRUSTED_BRANCH: ${{ inputs.trusted_branch }}
      run: |
        set -euo pipefail

        # Refuse anything that is not a plausible ref or SHA before it reaches
        # git. Not the security boundary -- ancestry is -- but it keeps option
        # injection and shell metacharacters out of the argument entirely.
        case "$SOURCE_REF" in
          -*|*' '*|*'"'*|*"'"*|*'$'*|*'`'*|*';'*|*'&'*|*'|'*|*'('*|*')'*|*'<'*|*'>'*|*'*'*|*'?'*|*'['*|*'^'*|*'~'*|*':'*|*'\'*)
            echo "::error::Refusing source_ref '${SOURCE_REF}': not a plain ref or commit."
            exit 1
            ;;
        esac

        git fetch --no-tags --prune origin \
          "+refs/heads/${TRUSTED_BRANCH}:refs/remotes/origin/${TRUSTED_BRANCH}"

        trusted_sha="$(git rev-parse --verify "refs/remotes/origin/${TRUSTED_BRANCH}")"

        # Fetch the requested revision explicitly. A commit that is already
        # reachable from the trusted branch is present after the fetch above,
        # so this only has to succeed for refs; a failure here is not fatal,
        # because the ancestry check below is what decides.
        git fetch --no-tags origin "$SOURCE_REF" 2>/dev/null || true

        source_sha=""
        for candidate in \
          "refs/remotes/origin/${SOURCE_REF}" \
          "refs/tags/${SOURCE_REF}" \
          "FETCH_HEAD" \
          "${SOURCE_REF}"; do
          if source_sha="$(git rev-parse --verify --quiet "${candidate}^{commit}")"; then
            break
          fi
          source_sha=""
        done

        if [ -z "$source_sha" ]; then
          echo "::error::source_ref '${SOURCE_REF}' does not resolve to a commit in this repository."
          exit 1
        fi

        # The gate.
        if ! git merge-base --is-ancestor "$source_sha" "$trusted_sha"; then
          echo "::error::Refusing to build or deploy ${source_sha}."
          echo "::error::It is not reachable from '${TRUSTED_BRANCH}' (${trusted_sha})."
          echo "::error::Only revisions a maintainer has already merged to the release lineage may obtain a deployment identity."
          exit 1
        fi

        echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
        echo "trusted_branch=${TRUSTED_BRANCH}" >> "$GITHUB_OUTPUT"

        {
          echo "### Source trust"
          echo ""
          echo "| field | value |"
          echo "| --- | --- |"
          echo "| requested | \`${SOURCE_REF}\` |"
          echo "| resolved | \`${source_sha}\` |"
          echo "| trusted branch | \`${TRUSTED_BRANCH}\` (\`${trusted_sha}\`) |"
          echo "| verdict | reachable from the release lineage |"
        } >> "$GITHUB_STEP_SUMMARY"
